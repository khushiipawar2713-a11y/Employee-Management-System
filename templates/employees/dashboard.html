{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Employee Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">📊 Employee Dashboard</h2>

    <div class="row">

        <div class="col-md-3">
            <div class="card bg-primary text-white shadow">
                <div class="card-body text-center">
                    <h5>Total Employees</h5>
                    <h2>{{ total_employees }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card bg-success text-white shadow">
                <div class="card-body text-center">
                    <h5>Total Departments</h5>
                    <h2>{{ total_departments }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card bg-warning shadow">
                <div class="card-body text-center">
                    <h5>Highest Salary</h5>
                    <h2>₹{{ highest_salary }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card bg-danger text-white shadow">
                <div class="card-body text-center">
                    <h5>Lowest Salary</h5>
                    <h2>₹{{ lowest_salary }}</h2>
                </div>
            </div>
        </div>

    </div>

    <div class="card mt-5 shadow">

        <div class="card-header bg-primary text-white">
            Employees by Department
        </div>

        <div class="card-body">
            <canvas id="departmentChart"></canvas>
        </div>

    </div>

    <div class="text-center mt-4">
        <a href="{% url 'employee_list' %}" class="btn btn-primary">
            ← Back to Employee List
        </a>
    </div>

</div>

<script>

const ctx = document.getElementById('departmentChart');

new Chart(ctx, {
    type: 'bar',
    data: {
        labels: [
             {% for item in department_data %}
                "{{ item.department }}",
            {% endfor %}
        ],
        datasets: [{
            label: 'Employees',
            data: [
                {% for item in department_data %}
                    {{ item.total }},
                {% endfor %}
            ],
            borderWidth: 1
        }]
    },
    options: {
        responsive: true,
        scales: {
            y: {
                beginAtZero: true
            }
        }
    }
});

</script>

</body>
</html>
